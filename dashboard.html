<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <h3 class="text-white">
            Smart Employee Management System
        </h3>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-4">

            <div class="card shadow p-3 text-center">

                <h5>Total Employees</h5>

                <h2>{{ total_employee }}</h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow p-3 text-center">

                <h5>Departments</h5>

                <h2>{{ total_department }}</h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow p-3 text-center">

                <h5>Attendance</h5>

                <h2>20</h2>

            </div>

        </div>

    </div>

    <div class="mt-5">

        <h2>Welcome Admin 🎉</h2>

        <p>Your Smart Employee Management System is working successfully.</p>

        <div class="mt-4">

            <a href="/employees" class="btn btn-primary btn-lg">
                Employee Management
            </a>

            <a href="/attendance" class="btn btn-success btn-lg">
                Attendance
            </a>

            <a href="/departments" class="btn btn-warning btn-lg">
                Departments
            </a>

        </div>

    </div>

</div>

</body>
</html>
