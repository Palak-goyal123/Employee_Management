<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Mark Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">Mark Attendance</h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Employee
                    </label>

                    <select name="emp_id"
                            class="form-control"
                            required>

                        <option value="">
                            Select Employee
                        </option>

                        {% for emp in employees %}

                        <option value="{{ emp.emp_id }}">

                            {{ emp.emp_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Attendance Date
                    </label>

                    <input type="date"
                           name="attendance_date"
                           class="form-control"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select name="status"
                            class="form-control"
                            required>

                        <option value="Present">
                            Present
                        </option>

                        <option value="Absent">
                            Absent
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn btn-success">

                    Save Attendance

                </button>

                <a href="{{ url_for('attendance') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
