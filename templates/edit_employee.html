<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Edit Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Edit Employee</h2>

        <form method="POST">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="emp_name"
                       value="{{ employee['emp_name'] }}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Gender</label>

                <select name="gender" class="form-control">

                    <option value="Male"
                    {% if employee['gender']=="Male" %}selected{% endif %}>
                    Male
                    </option>

                    <option value="Female"
                    {% if employee['gender']=="Female" %}selected{% endif %}>
                    Female
                    </option>

                </select>

            </div>

            <div class="mb-3">
                <label>Age</label>

                <input type="number"
                       name="age"
                       value="{{ employee['age'] }}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">
                <label>Phone</label>

                <input type="text"
                       name="phone"
                       value="{{ employee['phone'] }}"
                       class="form-control">

            </div>

            <div class="mb-3">
                <label>Email</label>

                <input type="email"
                       name="email"
                       value="{{ employee['email'] }}"
                       class="form-control">

            </div>

            <div class="mb-3">
                <label>Department</label>

                <input type="text"
                       name="department"
                       value="{{ employee['department'] }}"
                       class="form-control">

            </div>

            <div class="mb-3">
                <label>Designation</label>

                <input type="text"
                       name="designation"
                       value="{{ employee['designation'] }}"
                       class="form-control">

            </div>

            <div class="mb-3">
                <label>Salary</label>

                <input type="number"
                       name="salary"
                       value="{{ employee['salary'] }}"
                       class="form-control">

            </div>

            <div class="mb-3">
                <label>Joining Date</label>

                <input type="date"
                       name="joining_date"
                       value="{{ employee['joining_date'] }}"
                       class="form-control">

            </div>

            <button class="btn btn-success">
                Update Employee
            </button>

            <a href="/employees" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>

</html>
